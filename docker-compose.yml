version: '3.9'

services:
  chatbi-backend:
    build: .
    container_name: vanna-chatbi-mvp
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/app  # Mount source code for development
      - ./chroma_db:/app/chroma_db  # Persist the Vector DB
      - C:/Users/redtea/.cache/chroma:/root/.cache/chroma # Mount local model cache to avoid re-downloading in container
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload # Enable auto-reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
