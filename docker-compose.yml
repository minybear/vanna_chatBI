version: '3.9'

services:
  chatbi-backend:
    build: .
    container_name: vanna-chatbi-mvp
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/app  # Mount source code for development
      - ./chroma_db:/app/chroma_db  # Persist the Vector DB
      - chroma_cache:/root/.cache/chroma  # Persist model cache
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload  # Enable auto-reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  chroma_cache:  # Named volume for model cache (cross-platform compatible)
